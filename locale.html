<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Select Language</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>

body{
font-family:Poppins;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#f97316,#ef4444);
color:white;
}

.box{
background:white;
color:black;
padding:50px;
border-radius:15px;
text-align:center;
width:300px;
}

button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:25px;
background:#f97316;
color:white;
font-size:16px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="box">
<h2>Select Language</h2>

<button onclick="setLang('en')">English</button><br><br>
<button onclick="setLang('te')">తెలుగు</button>

</div>

<script>
function setLang(lang){
localStorage.setItem("lang",lang);
window.location.href="index.html";
}
</script>

</body>
</html>
